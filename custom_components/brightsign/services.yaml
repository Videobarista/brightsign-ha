send_udp:
  fields:
    host:
      required: true
      example: "192.168.1.50"
      selector:
        text:
    port:
      required: false
      default: 5000
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    message:
      required: true
      example: "play"
      selector:
        text:
